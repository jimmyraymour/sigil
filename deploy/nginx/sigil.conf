# Sigil production nginx example
#
# Install as /etc/nginx/sites-available/sigil and enable it with a symlink.
# Replace the domain, certificate paths, PHP-FPM socket, and filesystem root.
# Keep the repository root outside nginx's document root: only public/ is served.

limit_req_zone $binary_remote_addr zone=sigil_api:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name sigil.example.com;

    # Use the HTTPS server below in production. This redirect is intentionally
    # simple; HTTP-01 certificate issuance can be enabled temporarily if needed.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sigil.example.com;

    root /var/www/sigil/public;
    index index.php;

    ssl_certificate /etc/letsencrypt/live/sigil.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sigil.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 1m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # The API front controller reads the original REQUEST_URI to route /api/v1.
    # The application also applies per-key request/render/cost limits.
    location ^~ /api/v1/ {
        limit_req zone=sigil_api burst=10 nodelay;
        try_files $uri /api.php?$query_string;
    }

    # Signed assets and the page front controller are the only PHP entry points.
    location = /render.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location = /api.php {
        internal;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location = /index.php {
        internal;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Never serve dotfiles, repository metadata, secrets, or source documents.
    location ~ /\. {
        deny all;
    }

    location ~* \.(?:env|md|sql|log|ini|conf|dist|bak|swp)$ {
        deny all;
    }

    # Do not allow arbitrary PHP files to become public entry points.
    location ~ \.php$ {
        return 404;
    }
}
